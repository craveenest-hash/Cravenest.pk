<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraveNest — Track Your Order</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0a08;
    --surface: #1a1410;
    --surface2: #241c15;
    --amber: #e8893a;
    --amber-light: #f5b06e;
    --cream: #f5ead8;
    --muted: #8a7565;
    --text: #f0e6d3;
    --border: rgba(232,137,58,0.18);
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.4rem 4rem;
    border-bottom: 1px solid var(--border);
    background: rgba(13,10,8,0.85);
    backdrop-filter: blur(20px);
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--amber);
    text-decoration: none;
  }

  .logo span { color: var(--cream); font-style: italic; }

  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  nav a:hover { color: var(--amber); }

  /* MAIN */
  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 4rem 2rem;
  }

  .track-card {
    width: 100%;
    max-width: 600px;
  }

  .track-title {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    font-weight: 900;
    text-align: center;
    margin-bottom: 0.5rem;
    line-height: 1;
  }

  .track-title em { color: var(--amber); font-style: italic; }

  .track-subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 2.5rem;
  }

  .search-box {
    display: flex;
    gap: 0.8rem;
    margin-bottom: 2.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem;
    transition: border-color 0.2s;
  }

  .search-box:focus-within { border-color: var(--amber); }

  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1.1rem;
    padding: 0.7rem 0.8rem;
    letter-spacing: 2px;
    font-family: monospace;
  }

  .search-box input::placeholder { color: var(--muted); letter-spacing: 0; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; }

  .search-box button {
    background: var(--amber);
    color: #0d0a08;
    border: none;
    padding: 0.7rem 1.5rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .search-box button:hover { background: var(--amber-light); }

  /* RESULT */
  #result { display: none; }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .result-header {
    background: var(--surface2);
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 1rem;
  }

  .order-id-big {
    font-family: monospace;
    font-size: 1.5rem;
    color: var(--amber);
    letter-spacing: 3px;
  }

  .order-time { color: var(--muted); font-size: 0.82rem; margin-top: 0.3rem; }

  .badge {
    display: inline-block;
    padding: 0.4rem 1rem;
    border-radius: 4px;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
  }

  .badge-pending { background: rgba(232,137,58,0.12); color: var(--amber); border: 1px solid rgba(232,137,58,0.3); }
  .badge-approved { background: rgba(74,222,128,0.1); color: var(--green); border: 1px solid rgba(74,222,128,0.25); }
  .badge-rejected { background: rgba(248,113,113,0.1); color: var(--red); border: 1px solid rgba(248,113,113,0.25); }
  .badge-preparing { background: rgba(251,191,36,0.1); color: var(--yellow); border: 1px solid rgba(251,191,36,0.25); }
  .badge-delivered { background: rgba(52,211,153,0.1); color: #34d399; border: 1px solid rgba(52,211,153,0.25); }

  /* TIMELINE */
  .timeline {
    padding: 2rem;
    border-bottom: 1px solid var(--border);
  }

  .timeline-title {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  .tl {
    display: flex;
    gap: 0;
    position: relative;
  }

  .tl-step {
    flex: 1;
    text-align: center;
    position: relative;
  }

  .tl-step::after {
    content: '';
    position: absolute;
    top: 18px;
    left: 50%;
    width: 100%;
    height: 2px;
    background: var(--border);
    z-index: 0;
  }

  .tl-step:last-child::after { display: none; }

  .tl-step.done::after { background: var(--amber); }

  .tl-dot {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--surface2);
    border: 2px solid var(--border);
    margin: 0 auto 0.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    position: relative;
    z-index: 1;
    transition: all 0.3s;
  }

  .tl-step.done .tl-dot {
    background: var(--amber);
    border-color: var(--amber);
  }

  .tl-step.current .tl-dot {
    background: var(--surface2);
    border-color: var(--amber);
    box-shadow: 0 0 0 4px rgba(232,137,58,0.18);
    animation: pulse 1.5s infinite;
  }

  .tl-label {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    line-height: 1.3;
  }

  .tl-step.done .tl-label,
  .tl-step.current .tl-label { color: var(--amber); }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(232,137,58,0.18); }
    50% { box-shadow: 0 0 0 8px rgba(232,137,58,0.08); }
  }

  .status-msg {
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    font-size: 0.92rem;
  }

  .status-msg .icon { font-size: 1.8rem; }

  .status-msg .msg-text { color: var(--muted); }

  /* ITEMS */
  .items-section { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); }

  .items-section h4 {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .item-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .item-row:last-child { border-bottom: none; }

  .item-total-row {
    display: flex;
    justify-content: space-between;
    padding: 1rem 0 0;
    font-size: 1.05rem;
    font-weight: 500;
    margin-top: 0.5rem;
    border-top: 1px solid var(--border);
  }

  .item-total-row span:last-child { color: var(--amber); font-size: 1.2rem; }

  /* DELIVERY */
  .delivery-section {
    padding: 1.5rem 2rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .d-item { font-size: 0.85rem; }
  .d-label { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.3rem; }

  /* NOT FOUND */
  .not-found {
    text-align: center;
    padding: 3rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
  }

  .not-found div:first-child { font-size: 3rem; margin-bottom: 1rem; }

  footer {
    border-top: 1px solid var(--border);
    padding: 2rem 4rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: 0.82rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  @media (max-width: 640px) {
    nav { padding: 1.2rem 1.5rem; }
    footer { padding: 1.5rem; }
    .result-header { flex-direction: column; }
    .delivery-section { grid-template-columns: 1fr; }
    .tl-label { font-size: 0.6rem; }
  }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">Crave<span>Nest</span></a>
  <a href="index.html">← Menu par wapis jayen</a>
</nav>

<main>
  <div class="track-card">
    <h1 class="track-title">Track Your<br><em>Order</em></h1>
    <p class="track-subtitle">Apna Order ID dalen aur real-time status dekhen</p>

    <div class="search-box">
      <input type="text" id="trackInput" placeholder="Order ID (e.g. CN-1234)" maxlength="10"
             oninput="this.value = this.value.toUpperCase()"
             onkeydown="if(event.key==='Enter') track()">
      <button onclick="track()">🔍 Track</button>
    </div>

    <div id="result"></div>

    <div style="text-align:center;color:var(--muted);font-size:0.82rem;margin-top:2rem;">
      Order ID woh hota hai jo order place karte waqt aapko diya gaya tha.<br>
      Koi masla ho toh 📷 @cravenest.pk par message karein.
    </div>
  </div>
</main>

<footer>
  <div style="font-family:'Playfair Display',serif;color:var(--amber);font-weight:700;">CraveNest</div>
  <div>Karachi, Pakistan &nbsp;•&nbsp; 📷 @cravenest.pk</div>
</footer>

<script>
const STEPS = [
  { key: 'pending',   icon: '📋', label: 'Order\nReceived' },
  { key: 'approved',  icon: '✅', label: 'Confirmed' },
  { key: 'preparing', icon: '👨‍🍳', label: 'Preparing' },
  { key: 'delivered', icon: '🎉', label: 'Delivered' },
];

const STATUS_MSGS = {
  pending:   { icon: '⏳', text: 'Aapka order humein mil gaya! Hum jaldi review karein ge aur confirm karein ge.' },
  approved:  { icon: '✅', text: 'Mubarak! Aapka order confirm ho gaya. Kitchen mein process ho raha hai.' },
  preparing: { icon: '👨‍🍳', text: 'Aapka khaana tayar ho raha hai. Thori der mein delivery par nikle ga!' },
  delivered: { icon: '🎉', text: 'Order deliver ho gaya! Khane ka maza lijiye. Dobara order karein!' },
  rejected:  { icon: '❌', text: 'Afsoos ke saath, is baar aapka order process nahi ho saka. Dobara try karein ya humse rabta karein.' },
};

function track() {
  const input = document.getElementById('trackInput').value.trim();
  const resultEl = document.getElementById('result');

  if (!input) {
    resultEl.style.display = 'block';
    resultEl.innerHTML = '<div class="not-found"><div>🤔</div><p>Pehle Order ID dalen</p></div>';
    return;
  }

  const orders = JSON.parse(localStorage.getItem('cravenest_orders') || '[]');
  const order = orders.find(o => o.id === input);

  if (!order) {
    resultEl.style.display = 'block';
    resultEl.innerHTML = `<div class="not-found"><div>📭</div><p>"${input}" se koi order nahi mila.<br>Order ID dubara check karein.</p></div>`;
    return;
  }

  const msg = STATUS_MSGS[order.status] || STATUS_MSGS.pending;

  let timelineHTML = '';
  if (order.status !== 'rejected') {
    const stepOrder = ['pending', 'approved', 'preparing', 'delivered'];
    const currentIdx = stepOrder.indexOf(order.status);
    timelineHTML = `
      <div class="timeline">
        <div class="timeline-title">Order Status</div>
        <div class="tl">
          ${STEPS.map((step, i) => {
            let cls = '';
            if (i < currentIdx) cls = 'done';
            else if (i === currentIdx) cls = 'current';
            return `
              <div class="tl-step ${cls}">
                <div class="tl-dot">${i <= currentIdx ? step.icon : ''}</div>
                <div class="tl-label">${step.label.replace('\n', '<br>')}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  const badgeClass = {
    pending: 'badge-pending', approved: 'badge-approved',
    preparing: 'badge-preparing', delivered: 'badge-delivered', rejected: 'badge-rejected'
  }[order.status] || 'badge-pending';

  resultEl.style.display = 'block';
  resultEl.innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <div>
          <div class="order-id-big">${order.id}</div>
          <div class="order-time">${new Date(order.time).toLocaleString('en-PK')}</div>
        </div>
        <span class="badge ${badgeClass}">${order.status.toUpperCase()}</span>
      </div>

      ${timelineHTML}

      <div class="status-msg">
        <div class="icon">${msg.icon}</div>
        <div class="msg-text">${msg.text}</div>
      </div>

      <div class="items-section">
        <h4>🧾 Order Items</h4>
        ${order.items.map(i => `
          <div class="item-row">
            <span>${i.name} <span style="color:var(--muted)">x${i.qty}</span></span>
            <span style="color:var(--amber)">Rs ${i.sub}</span>
          </div>
        `).join('')}
        <div class="item-total-row">
          <span>Total</span>
          <span>Rs ${order.total}</span>
        </div>
      </div>

      <div class="delivery-section">
        <div class="d-item">
          <div class="d-label">Delivery Address</div>
          <div>${order.address}, ${order.city}</div>
        </div>
        <div class="d-item">
          <div class="d-label">Payment</div>
          <div>${order.payment}</div>
        </div>
        <div class="d-item">
          <div class="d-label">Customer</div>
          <div>${order.name}</div>
        </div>
        ${order.notes ? `<div class="d-item"><div class="d-label">Note</div><div>${order.notes}</div></div>` : ''}
      </div>
    </div>
  `;
}

// Auto-fill from URL params
const params = new URLSearchParams(window.location.search);
if (params.get('id')) {
  document.getElementById('trackInput').value = params.get('id').toUpperCase();
  track();
}
</script>

</body>
</html>
