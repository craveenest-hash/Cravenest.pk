<style>
:root{
  --olive:#1b2210;--olive2:#222c15;--olive3:#2a3619;
  --gold:#c89535;--gold-lt:#e4b55c;--gold-pal:#f2dba8;
  --cream:#f5eed8;--muted:#7a8a60;
  --border:rgba(200,149,53,.2);--border2:rgba(200,149,53,.1);
  --text:#ede5cc;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--olive);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--olive);}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px;}

/* LOGIN */
.login-wrap{min-height:100vh;display:grid;place-items:center;background:var(--olive2);}
.login-box{
  background:var(--olive3);border:1px solid var(--border);
  border-radius:14px;padding:3rem;width:380px;max-width:92vw;text-align:center;
  animation:fadeUp .5s ease;
}
.login-logo{display:flex;align-items:center;justify-content:center;gap:.8rem;margin-bottom:.4rem;}
.login-logo img{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--gold);}
.login-brand{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:900;color:var(--cream);}
.login-brand span{color:var(--gold);}
.login-sub{color:var(--muted);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2rem;}
.lg{margin-bottom:1rem;text-align:left;}
.lg label{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem;}
.lg input{
  width:100%;background:var(--olive2);border:1px solid var(--border2);
  color:var(--text);font-family:'Outfit',sans-serif;font-size:.92rem;
  padding:.8rem 1rem;border-radius:5px;outline:none;transition:border-color .2s;
}
.lg input:focus{border-color:var(--gold);}
.lg input::placeholder{color:var(--muted);}
.err{color:var(--red);font-size:.78rem;margin-bottom:.8rem;display:none;}
.btn-gold{
  background:var(--gold);color:var(--olive);border:none;
  padding:.9rem 1.5rem;font-family:'Outfit',sans-serif;font-weight:600;
  font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;
  border-radius:3px;cursor:pointer;width:100%;
  transition:background .2s;
}
.btn-gold:hover{background:var(--gold-lt);}

/* ADMIN SHELL */
.admin-wrap{display:none;min-height:100vh;}
header{
  display:flex;justify-content:space-between;align-items:center;
  padding:0 2.5rem;height:68px;
  background:var(--olive2);border-bottom:1px solid var(--border2);
  position:sticky;top:0;z-index:100;
}
.h-brand{display:flex;align-items:center;gap:.8rem;}
.h-brand img{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);object-fit:cover;}
.h-brand-name{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;color:var(--cream);}
.h-brand-name span{color:var(--gold);}
.h-admin-tag{
  background:rgba(200,149,53,.1);border:1px solid var(--border);
  color:var(--gold);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;
  padding:.2rem .7rem;border-radius:2rem;
}
.h-right{display:flex;align-items:center;gap:1.5rem;}
.h-time{color:var(--muted);font-size:.78rem;}
.logout-btn{
  background:transparent;border:1px solid var(--border);
  color:var(--muted);font-family:'Outfit',sans-serif;
  font-size:.75rem;padding:.38rem .9rem;border-radius:3px;
  cursor:pointer;transition:all .2s;
}
.logout-btn:hover{border-color:var(--red);color:var(--red);}

/* STATS */
.stats-row{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:1rem;padding:1.8rem 2.5rem 0;
}
.stat-card{
  background:var(--olive2);border:1px solid var(--border2);
  border-radius:8px;padding:1.2rem 1.5rem;
}
.sc-label{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem;}
.sc-val{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--gold);}

/* CONTROLS */
.controls{
  padding:1.3rem 2.5rem;
  display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;
}
.f-btn{
  padding:.4rem 1rem;border:1px solid var(--border2);
  background:transparent;color:var(--muted);font-family:'Outfit',sans-serif;
  font-size:.75rem;letter-spacing:.07em;border-radius:3px;cursor:pointer;transition:all .2s;
}
.f-btn.active,.f-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(200,149,53,.07);}
.refresh-btn{
  margin-left:auto;padding:.4rem 1rem;
  border:1px solid var(--gold);background:rgba(200,149,53,.08);
  color:var(--gold);font-family:'Outfit',sans-serif;
  font-size:.75rem;border-radius:3px;cursor:pointer;transition:all .2s;
}
.refresh-btn:hover{background:rgba(200,149,53,.16);}

/* TABLE */
.table-wrap{padding:0 2.5rem 3rem;overflow-x:auto;}
table{width:100%;border-collapse:collapse;background:var(--olive2);border:1px solid var(--border2);border-radius:10px;overflow:hidden;}
thead{background:var(--olive3);border-bottom:1px solid var(--border2);}
th{padding:.9rem 1.1rem;text-align:left;font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500;}
td{padding:.9rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.04);font-size:.86rem;vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(200,149,53,.03);}
.oid{font-family:monospace;color:var(--gold);font-size:.88rem;cursor:pointer;text-decoration:underline dotted;}
.item-list{font-size:.78rem;color:var(--muted);line-height:1.65;}

/* STATUS BADGE */
.sbadge{
  display:inline-block;padding:.2rem .65rem;
  border-radius:3px;font-size:.65rem;letter-spacing:.08em;
  text-transform:uppercase;font-weight:500;
}
.s-pending{background:rgba(200,149,53,.12);color:var(--gold);border:1px solid rgba(200,149,53,.3);}
.s-approved{background:rgba(74,222,128,.1);color:var(--green);border:1px solid rgba(74,222,128,.25);}
.s-preparing{background:rgba(251,191,36,.1);color:var(--yellow);border:1px solid rgba(251,191,36,.25);}
.s-delivered{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.25);}
.s-rejected{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.25);}

/* ACTION BTNS */
.act-group{display:flex;gap:.4rem;flex-wrap:wrap;}
.a-btn{
  padding:.3rem .8rem;border-radius:3px;font-family:'Outfit',sans-serif;
  font-size:.7rem;cursor:pointer;border:1px solid;transition:all .15s;font-weight:500;
}
.a-approve{border-color:rgba(74,222,128,.4);color:var(--green);background:rgba(74,222,128,.06);}
.a-approve:hover{background:rgba(74,222,128,.14);}
.a-prep{border-color:rgba(251,191,36,.4);color:var(--yellow);background:rgba(251,191,36,.06);}
.a-prep:hover{background:rgba(251,191,36,.14);}
.a-deliver{border-color:rgba(52,211,153,.4);color:#34d399;background:rgba(52,211,153,.06);}
.a-deliver:hover{background:rgba(52,211,153,.14);}
.a-reject{border-color:rgba(248,113,113,.4);color:var(--red);background:rgba(248,113,113,.06);}
.a-reject:hover{background:rgba(248,113,113,.14);}
.a-view{border-color:var(--border);color:var(--muted);background:transparent;}
.a-view:hover{border-color:var(--gold);color:var(--gold);}

.empty-state{text-align:center;padding:3.5rem;color:var(--muted);}
.empty-state div:first-child{font-size:2.5rem;margin-bottom:.8rem;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;place-items:center;z-index:500;backdrop-filter:blur(5px);}
.modal-overlay.open{display:grid;}
.modal-box{
  background:var(--olive2);border:1px solid var(--border);
  border-radius:14px;padding:2.5rem;max-width:500px;
  width:90%;max-height:82vh;overflow-y:auto;
  animation:fadeUp .3s ease;
}
.modal-title{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--gold);margin-bottom:1.5rem;}
.d-row{display:flex;gap:.8rem;margin-bottom:.7rem;font-size:.87rem;}
.d-lbl{color:var(--muted);min-width:90px;flex-shrink:0;}
.email-sec{margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border2);}
.email-sec h4{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.9rem;}
.email-box{
  background:var(--olive3);border:1px solid var(--border2);
  border-radius:6px;padding:1.1rem;font-size:.78rem;
  line-height:1.75;color:var(--muted);
  white-space:pre-wrap;font-family:monospace;margin-bottom:.9rem;
}
.copy-btn{
  background:transparent;border:1px solid var(--gold);
  color:var(--gold);padding:.45rem 1.1rem;border-radius:3px;
  cursor:pointer;font-size:.75rem;font-family:'Outfit',sans-serif;
  transition:background .2s;margin-right:.5rem;
}
.copy-btn:hover{background:rgba(200,149,53,.12);}
.close-btn{
  background:transparent;border:1px solid var(--border2);
  color:var(--muted);padding:.45rem 1.1rem;border-radius:3px;
  cursor:pointer;font-size:.75rem;font-family:'Outfit',sans-serif;
}

/* TOAST */
.toast{
  position:fixed;bottom:2rem;right:2rem;
  background:var(--olive3);border:1px solid var(--gold);
  color:var(--cream);padding:.8rem 1.3rem;border-radius:8px;
  font-size:.85rem;z-index:9998;display:none;
  animation:slideIn .3s ease;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{transform:translateX(80px);opacity:0}to{transform:translateX(0);opacity:1}}

@media(max-width:768px){
  header,.stats-row,.controls,.table-wrap{padding-left:1rem;padding-right:1rem;}
}
</style>

<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <div class="modal-title" id="mTitle">Order Details</div>
    <div id="mContent"></div>
    <div class="email-sec">
      <h4>📧 Email Draft — Copy & Send to Customer</h4>
      <div class="email-box" id="mEmail"></div>
      <button class="copy-btn" onclick="copyEmail()">📋 Copy</button>
      <button class="close-btn" onclick="closeDetail()">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const U='admin',P='cravenest123';
let curFilt='all';

function doLogin(){
  if(document.getElementById('lUser').value===U&&document.getElementById('lPass').value===P){
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('adminWrap').style.display='block';
    loadAll();startClock();
  } else {
    document.getElementById('lErr').style.display='block';
  }
}
function logout(){
  document.getElementById('loginWrap').style.display='grid';
  document.getElementById('adminWrap').style.display='none';
}
function startClock(){
  const el=document.getElementById('hTime');
  setInterval(()=>el.textContent=new Date().toLocaleString('en-PK'),1000);
}
function getOrders(){return JSON.parse(localStorage.getItem('cn_orders')||'[]').reverse();}
function saveOrders(arr){localStorage.setItem('cn_orders',JSON.stringify(arr.reverse()));}

function loadAll(){
  const orders=getOrders();
  renderStats(orders);
  renderTable(orders);
}
function renderStats(orders){
  const total=orders.length;
  const pending=orders.filter(o=>o.status==='pending').length;
  const today=orders.filter(o=>new Date(o.time).toDateString()===new Date().toDateString()).length;
  const rev=orders.filter(o=>o.status!=='rejected').reduce((s,o)=>s+o.total,0);
  document.getElementById('statsRow').innerHTML=`
    <div class="stat-card"><div class="sc-label">Total Orders</div><div class="sc-val">${total}</div></div>
    <div class="stat-card"><div class="sc-label">⏳ Pending</div><div class="sc-val" style="color:var(--yellow)">${pending}</div></div>
    <div class="stat-card"><div class="sc-label">Today</div><div class="sc-val">${today}</div></div>
    <div class="stat-card"><div class="sc-label">Revenue</div><div class="sc-val">Rs ${rev.toLocaleString()}</div></div>
  `;
}
function filt(f,btn){
  curFilt=f;
  document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable(getOrders());
}
function renderTable(orders){
  const list=curFilt==='all'?orders:orders.filter(o=>o.status===curFilt);
  const tb=document.getElementById('tBody');
  if(!list.length){
    tb.innerHTML=`<tr><td colspan="7"><div class="empty-state"><div>📭</div>No orders found.</div></td></tr>`;
    return;
  }
  const sCls={pending:'s-pending',approved:'s-approved',preparing:'s-preparing',delivered:'s-delivered',rejected:'s-rejected'};
  const sIcon={pending:'⏳',approved:'✅',preparing:'👨‍🍳',delivered:'🎉',rejected:'❌'};
  tb.innerHTML=list.map(o=>{
    const acts=o.status==='pending'
      ?`<button class="a-btn a-approve" onclick="setStatus('${o.id}','approved')">✅ Approve</button>
         <button class="a-btn a-reject" onclick="setStatus('${o.id}','rejected')">❌ Reject</button>`
      :o.status==='approved'
      ?`<button class="a-btn a-prep" onclick="setStatus('${o.id}','preparing')">👨‍🍳 Preparing</button>
         <button class="a-btn a-reject" onclick="setStatus('${o.id}','rejected')">Cancel</button>`
      :o.status==='preparing'
      ?`<button class="a-btn a-deliver" onclick="setStatus('${o.id}','delivered')">🎉 Delivered</button>`
      :'';
    return`<tr>
      <td><span class="oid" onclick="showDetail('${o.id}')">${o.id}</span></td>
      <td><div style="font-weight:500">${o.name}</div><div style="color:var(--muted);font-size:.76rem">${o.phone}</div></td>
      <td><div class="item-list">${o.items.map(i=>`${i.name} x${i.qty}`).join('<br>')}</div></td>
      <td style="color:var(--gold);font-weight:600">Rs ${o.total}</td>
      <td style="color:var(--muted);font-size:.76rem">${new Date(o.time).toLocaleString('en-PK',{dateStyle:'short',timeStyle:'short'})}</td>
      <td><span class="sbadge ${sCls[o.status]||'s-pending'}">${sIcon[o.status]||'⏳'} ${o.status}</span></td>
      <td><div class="act-group">${acts}<button class="a-btn a-view" onclick="showDetail('${o.id}')">👁 View</button></div></td>
    </tr>`;
  }).join('');
}
function setStatus(id,status){
  const arr=JSON.parse(localStorage.getItem('cn_orders')||'[]');
  const i=arr.findIndex(o=>o.id===id);
  if(i>-1){arr[i].status=status;localStorage.setItem('cn_orders',JSON.stringify(arr));loadAll();showToast(`✅ Order ${id} → ${status}`);}
}
function showDetail(id){
  const arr=JSON.parse(localStorage.getItem('cn_orders')||'[]');
  const o=arr.find(x=>x.id===id);if(!o)return;
  document.getElementById('mTitle').textContent='Order '+o.id;
  document.getElementById('mContent').innerHTML=`
    <div class="d-row"><span class="d-lbl">Customer</span><span>${o.name}</span></div>
    <div class="d-row"><span class="d-lbl">Phone</span><span>${o.phone}</span></div>
    <div class="d-row"><span class="d-lbl">Address</span><span>${o.address}${o.area?', '+o.area:''}</span></div>
    <div class="d-row"><span class="d-lbl">Payment</span><span>${o.payment}</span></div>
    <div class="d-row"><span class="d-lbl">Status</span><span style="text-transform:uppercase;color:var(--gold)">${o.status}</span></div>
    ${o.notes?`<div class="d-row"><span class="d-lbl">Notes</span><span>${o.notes}</span></div>`:''}
    <div style="border-top:1px solid var(--border2);padding-top:1rem;margin-top:.5rem;">
      ${o.items.map(i=>`<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:.4rem 0;border-bottom:1px solid var(--border2)"><span>${i.name} x${i.qty}</span><span style="color:var(--gold)">Rs ${i.sub}</span></div>`).join('')}
      <div style="display:flex;justify-content:space-between;margin-top:.8rem;font-weight:600">
        <span>Total</span><span style="font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--gold)">Rs ${o.total}</span>
      </div>
    </div>
  `;
  const msgs={
    pending:'Aapka order humein mil gaya. Hum jald confirm karein ge.',
    approved:'Mubarak! Aapka order confirm ho gaya aur jald tayar kiya jaye ga.',
    preparing:'Aapka order kitchen mein tayar ho raha hai. Jald deliver ho ga!',
    delivered:'Aapka order deliver ho gaya! Khane ka maza lijiye. 🎉',
    rejected:'Is baar order process nahi ho saka. Please dobara try karein ya humse contact karein.',
  };
  document.getElementById('mEmail').textContent=
`To: ${o.name} — ${o.phone}
Subject: CraveNest Order ${o.id} — ${o.status.toUpperCase()}

Assalam o Alaikum ${o.name},

${msgs[o.status]||''}

📋 Order Summary:
${o.items.map(i=>`  • ${i.name} x${i.qty} — Rs ${i.sub}`).join('\n')}

💰 Total: Rs ${o.total}
📦 Delivery: ${o.address}${o.area?', '+o.area:''}
💳 Payment: ${o.payment}

JazakAllah! ❤️
— CraveNest Team
📷 @cravenest.pk  |  📞 0347 8303147`;
  document.getElementById('detailModal').classList.add('open');
}
function copyEmail(){
  navigator.clipboard.writeText(document.getElementById('mEmail').textContent)
    .then(()=>showToast('📋 Email copied!'))
    .catch(()=>showToast('Please copy manually.'));
}
function closeDetail(){document.getElementById('detailModal').classList.remove('open');}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}

// Seed demo data
(function seed(){
